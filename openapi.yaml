openapi: 3.1.0
info:
  title: MCP Security Gateway Management API
  version: 0.1.0
  description: Approvals, audit inspection, health, and upstream tool baselines.
servers:
  - url: http://localhost:8080
paths:
  /health/live:
    get:
      operationId: live
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: ready
      responses:
        "200":
          description: Required dependencies and policy are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Gateway is not ready and will fail closed.
  /v1/approvals/{approval_id}:
    get:
      operationId: getApproval
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          description: Approval request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/approvals/{approval_id}/decision:
    post:
      operationId: decideApproval
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: Updated approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "409":
          description: Approval already consumed, expired, or decided.
  /v1/audit:
    get:
      operationId: listAuditEvents
      security:
        - bearerAuth: []
      parameters:
        - name: correlation_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Newest audit events first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
  /v1/tool-baselines/pending:
    get:
      operationId: listPendingToolBaselines
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Discovered definitions that do not match an approved digest.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [server_id, tool, digest]
                  properties:
                    server_id:
                      type: string
                    tool:
                      type: object
                    digest:
                      type: string
                    previous_digest:
                      type: [string, "null"]
  /v1/tool-baselines/{server_id}/{tool_name}/approve:
    post:
      operationId: approveToolBaseline
      security:
        - bearerAuth: []
      parameters:
        - name: server_id
          in: path
          required: true
          schema:
            type: string
        - name: tool_name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The currently discovered exact definition digest was approved.
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Resource not found.
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    ApprovalDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        reason:
          type: string
          maxLength: 500
    Approval:
      type: object
      required: [id, principal_id, server_id, tool_name, status, expires_at]
      properties:
        id:
          type: string
          format: uuid
        principal_id:
          type: string
        server_id:
          type: string
        tool_name:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, consumed, expired]
        expires_at:
          type: string
          format: date-time
    AuditEvent:
      type: object
      required: [id, occurred_at, correlation_id, decision]
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        correlation_id:
          type: string
        principal_id:
          type: string
        server_id:
          type: string
        tool_name:
          type: [string, "null"]
        decision:
          type: string
        reason:
          type: string
